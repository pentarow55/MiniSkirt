; MiniSkirt 実験版の設定
; メモ: スカート下の脚は、NPC の体 nif を読んで複製し、足首〜band_top の範囲だけ描く「帯」を付けて補う（ファイルは作らない）。
;       うまく作れないときだけ Data\Meshes\MiniSkirt\band_*.nif に書き出す方式に戻る（予備）
;
; ゲーム中の設定: SkyUI VR と MCM Helper VR が入っていれば、MCM（Mod 設定メニュー）の「MiniSkirt」で
;   有効・裾の高さ・お尻のゆとり・広がり角度・脚（帯）の上端・すき間を変えられる。メニューを閉じたときに、いま居る NPC にも反映する。
;   MCM で変えた値は Data\MCM\Settings\MiniSkirt.ini に保存され、このファイルの同じ項目より優先される
;   （MCM が無い環境では、このファイルだけで動く）
[General]
; 1: スカートと判定したら実際に頂点を書き換える / 0: 判定とログだけ
apply=1
; 腰の高さ（これより下を縮める。Skyrim の単位、足元 0・頭のてっぺん約 128）
waist=70
; ---- スカートの丈 ----
; skirt_length_cm: スカート丈（ウエストバンドの上端からすそまで、cm。身長 165 cm の標準の体での目安）。16〜55。
;   どのスカートもすそがこの位置にそろう（NPC の身長が違っても体の同じ位置）。元の服より長くはならない
;   目安: 16 ≒ マイクロミニ（お尻がぎりぎり隠れる）/ 25 ≒ 太ももの付け根の下 / 40 ≒ 太ももの真ん中 / 45 ≒ ひざの少し上 / 52 ≒ ひざ
skirt_length_cm=22
; ---- スカートの形（A ライン: お尻で膨らみ、その下は斜めにまっすぐ広がる） ----
; 縮めたスカートを、帯の体（NPC の体）に合わせて作り直す。帯の上端から下へなめらかに膨らみ、角度ごとに体（お尻・太もも）が
; いちばん外に出ている高さ（お尻の線）で「体 + hip_ease」になり、そこから下は flare_angle の角度で直線に広がる。
; 元の服のひだ・重ねの凹凸はそのまま残す。袖（腕の骨の重み、または体の腕・手に近い所）は動かさない。
; 形を作ってから、帯とのすき間の押し出し（skirt_gap）をかける（安全策。ほとんど働かない見込み）
; hip_ease: お尻まわりのゆとり（体のいちばん外からの幅）。お尻がスカートを突き破るときは大きくする
hip_ease=1.0
; flare_angle: お尻の線より下の広がり角度（度）。0 でまっすぐ下。8 ≒ 元の服くらい（この環境の服の中央値は 6〜12）
flare_angle=5
; 帯（スカートの下の脚を補う裸の体）の上端。足首からこの高さまでを付け、服の中の肌の脚（帯と重なる所）は消す（腕・手首は除く）。
; 既定 75。80 ≒ 腰骨の少し下（股・お尻を全部含む。スカートの中から見える）。64 ≒ 股の少し下（股・お尻は見えない）。
; お尻の揺れでスカートを突き抜けないよう、スカートは skirt_gap だけ離す（お尻より上は上端に向かって弱める）
band_top=75
; 1: スカートの中に下着を着ける（帯の元を下着つきの体にする）。NPC の所持品・既定の服装の体スロットの防具から下着らしい物
;    （名前・キーワードに underwear / lingerie / panties / bra / 下着 など、モデルのパス、脚の無い短い形）を選び、
;    無ければロード順の全防具の下着らしい物から NPC ごとに決まった 1 つを選ぶ（下着 MOD が無ければ裸の帯）。
;    Dynamic Armor Variants の差し替え（HasKeyword / WornHasKeyword の条件だけ）も当てる。0: 裸の帯だけ
underwear=1
; 1: 縮めた頂点の骨の重みを、動かした先の高さの重み（縮める前のいちばん近い頂点の物）に写し替える。0: 元のまま（すねの骨で動く）
remap_weights=1
; 1: 裾より下の布を縮めず切り捨てる（縮めると布が腰に溜まり、スカートの中を覗くと黒い塊になる）。0: 縮める（旧方式）
cut_cloth=1
; 1: スカートの shape を両面描画にする（切る方式で、外側の布の裏側が見えるように）
two_sided=1
; 1: お尻の揺れ骨が無い服で、体に近いスカートの所を体と同じように動かす（立ち姿勢・動作でお尻や太ももが突き抜けにくくなる）
body_weights=1
; 1: スカートの中の「下向きの水平な面」（覗くと黒い天井になる）を面積 0 にして消す
weld_ceiling=1
; 短くしたスカートを、帯（裸の体）から離す幅（初めの姿勢で、足りない所だけ外へ押し出す）。
; skirt_gap: スカートにお尻の揺れ骨があり、お尻の揺れに合わせて動かせる服 / skirt_gap_nobone: 揺れ骨が無い服（広めに離す）
skirt_gap=1.0
skirt_gap_nobone=1.0
; 1: 帯のお尻などの揺れを止める（上の 2 つでもお尻が突き抜けるときの最後の手段）。帯は体ごとに共有なので、全 NPC 共通で止まる
band_freeze_jiggle=0
