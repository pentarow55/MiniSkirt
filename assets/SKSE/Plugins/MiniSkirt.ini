; MiniSkirt settings
;
; With SkyUI and MCM Helper (for VR: SkyUI VR and MCM Helper VR) you can change the main settings in game,
; under "MiniSkirt" in the MCM. They are applied to the NPCs around you when you close the menu.
; Values changed in the MCM are saved to Data\MCM\Settings\MiniSkirt.ini and take priority over the same keys here.
; Without the MCM, this file alone is used.
;
; Heights are in Skyrim units for a standard body: 0 at the feet, about 128 at the top of the head.
[General]
; 1: shorten the skirts / 0: only detect them and write to the log (for troubleshooting)
apply=1
; Waist height. Only the part of the outfit below this height is changed.
waist=70

; ---- Skirt length ----
; skirt_length: length from the top of the waistband to the hem, in %. 100 is the hem of a standard long vanilla dress (about 8 cm above the floor). 17 to 100.
;   Every skirt ends at the same place on the body, whatever the NPC's height. Skirts never get longer than the original outfit.
;   17: micro mini (just covers the buttocks) / 27: just below the top of the thigh / 43: mid-thigh / 49: just above the knee / 56: knee / 100: original length
;   At 100, every outfit keeps its original length and shape, even one that reaches the floor; only the legs are replaced with the body's legs.
;   A skirt that is already shorter than the length you set is also left as it is.
;   (Version 1.0 used skirt_length_cm in cm. It is still read and converted.)
skirt_length=24
; 1: leave elderly women (NPCs of the elder race) alone: no shortening, no added legs
exclude_elderly=0

; ---- Skirt shape (A-line: follows the hips, then flares out in a straight line) ----
; The pleats and layers of the original outfit are kept. Sleeves are not changed.
; hip_ease: room around the widest part of the hips and thighs. Increase it if the buttocks poke through the skirt.
hip_ease=1.0
; flare_angle: angle (degrees) at which the skirt spreads out below the hips. 0 hangs straight down. About 8 is like most original outfits.
flare_angle=5

; ---- Legs under the skirt ----
; The outfit's own legs are hidden and bare legs (from the NPC's body, in her skin tone) are shown from the ankles up to band_top.
; 80: just below the hip bones (the crotch and buttocks are included and can be seen from below the skirt)
; 64: just below the crotch (the crotch and buttocks are not added). Default 78.
band_top=78
; 1: put underwear on the added legs. Picks something underwear-like from the NPC's inventory or outfit
;    (by name, keywords such as underwear / lingerie / panties / bra, model path, and shape).
;    If she has none, one item is picked for each NPC from the underwear installed in your load order
;    (bare legs if you have no underwear mod). Dynamic Armor Variants replacements (HasKeyword / WornHasKeyword only) are applied.
; 0: bare legs only
underwear=1

; ---- Advanced (you normally don't need to change these) ----
; 1: the shortened part moves with the bones at its new height / 0: keep the original bone weights
remap_weights=1
; 1: cut off the cloth below the hem / 0: squash it up instead (old method; leaves a dark lump inside the skirt)
cut_cloth=1
; 1: draw the skirt on both sides, so the inside of the cloth is visible from below
two_sided=1
; 1: for outfits without buttock jiggle bones, move the parts of the skirt close to the body together with the body
;    (the hips and thighs poke through less when standing and moving)
body_weights=1
; 1: remove the flat downward-facing surfaces inside the skirt (they look like a dark ceiling from below)
weld_ceiling=1

; ---- Gap between skirt and legs ----
; Only the parts of the skirt that are too close to the legs are pushed out.
; skirt_gap: outfits whose skirt moves with the buttocks (has buttock jiggle bones)
; skirt_gap_nobone: outfits whose skirt does not sway (set it wider, since these poke through more easily)
skirt_gap=1.0
skirt_gap_nobone=1.0
; 1: stop the jiggle of the added legs (last resort if the buttocks still poke through). This applies to all NPCs.
band_freeze_jiggle=0
